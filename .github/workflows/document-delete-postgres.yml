name: Document deletion PostgreSQL security tests

on:
  pull_request:
    paths:
      - "backend/tests/postgres/**"
      - "backend/tests/document_deletion_retry_test.php"
      - "supabase/migrations/20261113152043_encrypted_private_ocr_result_storage.sql"
      - "supabase/migrations/20261114040000_add_owner_scoped_document_deletion.sql"
      - ".github/workflows/document-delete-postgres.yml"

permissions:
  contents: read

jobs:
  postgres-document-delete:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kavoryn_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kavoryn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: PostgreSQL owner isolation and OCR concurrency integration tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: kavoryn_test
        run: bash backend/tests/postgres_document_deletion_integration.sh

      - name: Private file cleanup retry test
        run: php backend/tests/document_deletion_retry_test.php
