name: PHP API checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "supabase/migrations/**"
      - ".github/workflows/php-api.yml"
  pull_request:
    paths:
      - "backend/**"
      - "supabase/migrations/**"
      - ".github/workflows/php-api.yml"

permissions:
  contents: read

jobs:
  php-api-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poppler PDF utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl,fileinfo
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find backend -type f -name '*.php' -print0)

      - name: Authentication verifier tests
        run: php backend/tests/auth_verifier_test.php

      - name: Consent service tests
        run: php backend/tests/consent_service_test.php

      - name: Supabase consent adapter tests
        run: php backend/tests/supabase_consent_store_test.php

      - name: Document upload tests
        run: php backend/tests/document_upload_test.php

      - name: Supabase document registry tests
        run: php backend/tests/supabase_document_registry_test.php

      - name: OCR worker tests
        run: php backend/tests/OcrWorkerTest.php

      - name: Encrypted OCR result sink tests
        run: php backend/tests/EncryptedOcrResultSinkTest.php

      - name: Encrypted OCR result reader tests
        run: php backend/tests/EncryptedOcrResultReaderTest.php

      - name: Google Cloud Vision OCR provider tests
        run: php backend/tests/GoogleCloudVisionOcrProviderTest.php

      - name: OpenAI document explainer tests
        run: php backend/tests/OpenAiDocumentExplainerTest.php

      - name: Gemini document explainer tests
        run: php backend/tests/GeminiDocumentExplainerTest.php

      - name: AI processing consent recorder tests
        run: php backend/tests/AiProcessingConsentRecorderTest.php

      - name: SSE event decoder tests
        run: php backend/tests/SseEventDecoderTest.php

      - name: Provider SSE event mapper tests
        run: php backend/tests/ProviderSseEventMapperTest.php

      - name: Secure cURL SSE transport policy tests
        run: php backend/tests/CurlSseStreamTransportTest.php

      - name: Provider stream request factory tests
        run: php backend/tests/ProviderStreamRequestFactoryTest.php

      - name: Provider chat streamer tests
        run: php backend/tests/ProviderChatStreamerTest.php

      - name: Provider chat streamer server configuration tests
        run: php backend/tests/ProviderChatStreamerFactoryTest.php

      - name: Grounded document Q&A policy tests
        run: php backend/tests/GroundedQuestionPolicyTest.php

      - name: Grounded document Q&A provider adapter tests
        run: php backend/tests/DocumentQuestionAnswererTest.php

      - name: Supabase document Q&A rate limiter tests
        run: php backend/tests/SupabaseAiQuestionRateLimiterTest.php


      - name: Chat storage adapter tests
        run: php backend/tests/SupabaseChatStoreTest.php

      - name: Paystack transaction client tests
        run: php backend/tests/PaystackClientTest.php

      - name: Paystack webhook verifier tests
        run: php backend/tests/PaystackWebhookVerifierTest.php

      - name: API smoke tests
        shell: bash
        run: |
          set -euo pipefail
          env -u SUPABASE_URL -u SUPABASE_PUBLISHABLE_KEY -u DOCUMENT_UPLOAD_ENABLED php -S 127.0.0.1:8080 -t backend/public > /tmp/kavoryn-php-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/v1/health > /tmp/kavoryn-health.json; then
              break
            fi
            sleep 1
          done

          php -r '
            $data = json_decode(file_get_contents("/tmp/kavoryn-health.json"), true, 512, JSON_THROW_ON_ERROR);
            if (($data["status"] ?? null) !== "ok" ||
                ($data["service"] ?? null) !== "kavoryn-api" ||
                !is_string($data["request_id"] ?? null) ||
                $data["request_id"] === "") {
                fwrite(STDERR, "Health response contract failed.\\n");
                exit(1);
            }
          '

          chat_status=$(curl --silent --output /tmp/kavoryn-chat.json --write-out '%{http_code}' http://127.0.0.1:8080/v1/chat/conversations)
          test "$chat_status" = "503"
          php -r '
            $data = json_decode(file_get_contents("/tmp/kavoryn-chat.json"), true, 512, JSON_THROW_ON_ERROR);
            if (($data["error"]["code"] ?? null) !== "chat_disabled") {
                fwrite(STDERR, "General-purpose chat must remain disabled until release gates pass.\\n");
                exit(1);
            }
          '

          auth_status=$(curl --silent --output /tmp/kavoryn-me.json --write-out '%{http_code}' http://127.0.0.1:8080/v1/me)
          test "$auth_status" = "503"
          php -r '
            $data = json_decode(file_get_contents("/tmp/kavoryn-me.json"), true, 512, JSON_THROW_ON_ERROR);
            if (($data["error"]["code"] ?? null) !== "authentication_not_configured") {
                fwrite(STDERR, "Auth endpoint must fail closed when configuration is absent.\\n");
                exit(1);
            }
          '

          explain_status=$(curl --silent --output /tmp/kavoryn-explain.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"confirmed":true,"provider":"gemini","language":"ha"}' http://127.0.0.1:8080/v1/documents/a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a12/explain)
          test "$explain_status" = "503"
          php -r '
            $data = json_decode(file_get_contents("/tmp/kavoryn-explain.json"), true, 512, JSON_THROW_ON_ERROR);
            if (($data["error"]["code"] ?? null) !== "authentication_not_configured") {
                fwrite(STDERR, "AI explanation endpoint must authenticate before processing consent or documents.\\n");
                exit(1);
            }
          '

          ask_status=$(curl --silent --output /tmp/kavoryn-ask.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"confirmed":true,"provider":"gemini","language":"ha","question":"Wace ce ranar biya?"}' http://127.0.0.1:8080/v1/documents/a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a12/ask)
          test "$ask_status" = "503"
          php -r '
            $data = json_decode(file_get_contents("/tmp/kavoryn-ask.json"), true, 512, JSON_THROW_ON_ERROR);
            if (($data["error"]["code"] ?? null) !== "document_qa_disabled") {
                fwrite(STDERR, "Document Q&A must remain disabled until staging and release gates pass.\\n");
                exit(1);
            }
          '

          result_status=$(curl --silent --output /tmp/kavoryn-result.json --write-out '%{http_code}' http://127.0.0.1:8080/v1/documents/a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a12/result)
          test "$result_status" = "503"
          php -r '
            $data = json_decode(file_get_contents("/tmp/kavoryn-result.json"), true, 512, JSON_THROW_ON_ERROR);
            if (($data["error"]["code"] ?? null) !== "authentication_not_configured") {
                fwrite(STDERR, "OCR result endpoint must authenticate before reading results.\\n");
                exit(1);
            }
          '

          upload_status=$(curl --silent --output /tmp/kavoryn-upload.json --write-out '%{http_code}' -X POST http://127.0.0.1:8080/v1/documents)
          test "$upload_status" = "503"
          php -r '
            $data = json_decode(file_get_contents("/tmp/kavoryn-upload.json"), true, 512, JSON_THROW_ON_ERROR);
            if (($data["error"]["code"] ?? null) !== "document_upload_disabled") {
                fwrite(STDERR, "Document upload must remain disabled until release gates pass.\\n");
                exit(1);
            }
          '

          consent_status=$(curl --silent --output /tmp/kavoryn-consent.json --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"action":"document.process","payload_sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","language":"ha","translate":false,"confirmed":true}' http://127.0.0.1:8080/v1/consents)
          test "$consent_status" = "503"
          php -r '
            $data = json_decode(file_get_contents("/tmp/kavoryn-consent.json"), true, 512, JSON_THROW_ON_ERROR);
            if (($data["error"]["code"] ?? null) !== "authentication_not_configured") {
                fwrite(STDERR, "Consent endpoint must fail closed without Auth configuration.\\n");
                exit(1);
            }
          '
