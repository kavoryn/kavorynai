name: Android auth unit tests

on:
  pull_request:
    branches: [integration/preview]
    paths:
      - "app/src/main/java/com/kavoryn/app/auth/**"
      - "app/src/main/java/com/kavoryn/app/MainActivity.kt"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/test/java/com/kavoryn/app/auth/**"
      - ".github/workflows/android-auth-unit-tests.yml"
  push:
    branches:
      - integration/preview
      - feature/stage-a-account-recovery-preview
    paths:
      - "app/src/main/java/com/kavoryn/app/auth/**"
      - "app/src/main/java/com/kavoryn/app/MainActivity.kt"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/test/java/com/kavoryn/app/auth/**"
      - ".github/workflows/android-auth-unit-tests.yml"

permissions:
  contents: read

jobs:
  auth-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run Android unit tests only (no APK build)
        run: gradle :app:testDebugUnitTest
