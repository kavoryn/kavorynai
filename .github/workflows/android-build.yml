name: Android build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      # Supabase URL and publishable key are public client configuration, but
      # are injected at build time so the repository never hard-codes them.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      # Must point to a publicly reachable, non-Production Preview API origin.
      # Do not use a Vercel SSO-protected URL or put a protection-bypass token in the APK.
      KAVORYN_API_BASE_URL: ${{ vars.KAVORYN_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v4
      - name: Validate Android staging build configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::Missing GitHub Actions secret SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing GitHub Actions secret SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          case "$SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::SUPABASE_URL must use HTTPS"; exit 1 ;;
          esac
          if [ -n "$KAVORYN_API_BASE_URL" ]; then
            case "$KAVORYN_API_BASE_URL" in
              https://*) ;;
              *) echo "::error::KAVORYN_API_BASE_URL must use HTTPS"; exit 1 ;;
            esac
          fi
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kavoryn-android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run Android Keystore instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-options: "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save"
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest
      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
